  <text x="714" y="143" text-anchor="end" fill="#718096" font-size="10">Crawlspace vent</text>
  <text x="360" y="296" text-anchor="middle" fill="#6AAAD4" font-size="10" font-weight="600">Vapor barrier (6-mil poly)</text>
