  <text x="566" y="166" fill="#718096" font-size="9" transform="rotate(90, 566, 166)">18 in. – 3 ft clearance</text>
  <rect x="115" y="340" width="490" height="31" fill="#EBF8FF" stroke="#90CDF4" stroke-width="1" rx="5"/>
  <text x="360" y="353" text-anchor="middle" fill="#2B6CB0" font-size="9" font-weight="500">Note: Gravity loads travel through the I-beams to interior piers.</text>
  <text x="360" y="365" text-anchor="middle" fill="#2B6CB0" font-size="9" font-weight="500">The perimeter wall provides lateral/uplift resistance and enclosure.</text>
  <rect x="10" y="374" width="700" height="48" fill="#C6F6D5" stroke="#38A169" stroke-width="1.5" rx="8"/>
  <text x="360" y="392" text-anchor="middle" fill="#22543D" font-size="12" font-weight="700">✓  Generally qualifies as a permanent foundation (FHA)</text>
  <text x="360" y="408" text-anchor="middle" fill="#2D3748" font-size="10">Key: home is bolted to perimeter wall  •  Reinforced footing below frost depth  •  Continuous perimeter enclosure</text>
  <text x="360" y="435" text-anchor="middle" fill="#A0AEC0" font-size="9">Educational reference — 24 CFR Part 3285 / HUD PFGMH</text>
